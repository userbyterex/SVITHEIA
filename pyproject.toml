[project]
name = "svitheia"
version = "0.1.0"
description = "Autonomous scientific discovery with causal rigor and falsification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0.0",
    "networkx>=3.0",
    "ollama>=0.3.0",
    "pydantic>=2.0",
]

[project.scripts]
svitheia = "bot.main:main"
